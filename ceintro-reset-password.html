<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - Ceintro</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
  <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --pg-primary: #0960cb;
      --pg-primary-dark: #074da3;
      --pg-primary-light: #3b82f6;
      --pg-primary-bg: #eff6ff;
      --pg-text: #0f172a;
      --pg-text-muted: #475569;
      --pg-text-light: #94a3b8;
      --pg-bg: #ffffff;
      --pg-bg-alt: #f8fafc;
      --pg-border: #e2e8f0;
      --pg-success: #10b981;
      --pg-radius: 16px;
      --pg-radius-lg: 24px;
      --pg-radius-pill: 100px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--pg-text);
      background: var(--pg-bg-alt);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo {
      font-family: 'Boldonse', cursive;
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--pg-primary);
      text-transform: lowercase;
      margin-bottom: 32px;
      text-align: center;
    }

    .card {
      background: var(--pg-bg);
      border-radius: var(--pg-radius-lg);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.04);
    }

    .card h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--pg-text);
    }

    .card p {
      font-size: 0.875rem;
      color: var(--pg-text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--pg-text);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1.5px solid var(--pg-border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
      color: var(--pg-text);
      background: var(--pg-bg);
    }

    .form-group input:focus {
      border-color: var(--pg-primary);
      box-shadow: 0 0 0 3px rgba(9, 96, 203, 0.1);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 32px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: var(--pg-radius-pill);
      cursor: pointer;
      transition: all 0.25s;
      background: var(--pg-primary);
      color: #fff;
      margin-top: 8px;
    }

    .btn:hover {
      background: var(--pg-primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(9, 96, 203, 0.3);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error-msg {
      font-size: 0.8rem;
      color: #ef4444;
      margin-top: 4px;
    }

    .alert {
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 500;
      text-align: center;
    }

    .alert-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .success-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 16px 0;
    }

    .success-lottie {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
    }

    .success-content h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--pg-text);
      margin-bottom: 8px;
    }

    .success-content p {
      font-size: 0.9rem;
      color: var(--pg-text-muted);
      margin-bottom: 0;
    }

    .hidden { display: none; }

    @media (max-width: 480px) {
      .card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="logo">ceintro</div>

  <!-- Error state: expired/invalid link -->
  <div id="errorState" class="card hidden">
    <div class="alert alert-error">
      Este link expirou ou é inválido.<br>
      Solicite um novo link de redefinição de senha no app Ceintro.
    </div>
  </div>

  <!-- Form state -->
  <div id="formState" class="card hidden">
    <h1>Redefinir senha</h1>
    <p>Digite sua nova senha abaixo.</p>
    <form id="resetForm">
      <div class="form-group">
        <label for="password">Nova senha</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar nova senha</label>
        <input type="password" id="confirmPassword" placeholder="Repita a senha" required minlength="6">
        <div id="matchError" class="error-msg hidden">As senhas não coincidem.</div>
      </div>
      <div id="submitError" class="error-msg hidden" style="margin-bottom: 8px;"></div>
      <button type="submit" class="btn" id="submitBtn">Redefinir senha</button>
    </form>
  </div>

  <!-- Success state -->
  <div id="successState" class="card hidden">
    <div class="success-content">
      <div class="success-lottie" id="lottieContainer"></div>
      <h2>Senha redefinida!</h2>
      <p>Volte ao app Ceintro para fazer login.</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    function playSuccessLottie() {
      lottie.loadAnimation({
        container: document.getElementById('lottieContainer'),
        renderer: 'svg',
        loop: false,
        autoplay: true,
        path: 'assets/Success.json'
      });
    }

    const SUPABASE_URL = 'https://ghvgecaojvaowjlluwgi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodmdlY2FvanZhb3dqbGx1d2dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyOTUyNTYsImV4cCI6MjA4OTg3MTI1Nn0.YFVcr4fgmFrVwIv_HKzhm7QS8u1WPa8HE1stWUxpqNU';

    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');

    const errorState = document.getElementById('errorState');
    const formState = document.getElementById('formState');
    const successState = document.getElementById('successState');

    if (params.get('error') || !accessToken) {
      errorState.classList.remove('hidden');
    } else {
      formState.classList.remove('hidden');
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const matchError = document.getElementById('matchError');
      const submitError = document.getElementById('submitError');
      const submitBtn = document.getElementById('submitBtn');

      matchError.classList.add('hidden');
      submitError.classList.add('hidden');

      if (password !== confirmPassword) {
        matchError.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Redefinindo...';

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password })
        });

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.msg || data.message || 'Erro ao redefinir senha.');
        }

        formState.classList.add('hidden');
        successState.classList.remove('hidden');
        playSuccessLottie();
      } catch (err) {
        submitError.textContent = err.message;
        submitError.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Redefinir senha';
      }
    });
  </script>

</body>
</html>
